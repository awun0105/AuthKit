[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "authkit"
version = "1.0.0"
description = "A production-grade, pluggable authentication library for FastAPI — JWT, OAuth2 (8 providers), MFA, RBAC, and full flow flexibility (email/SMS, link/OTP, multi-identifier login)."
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "promaximus" },
    { name = "John Adeniran (timihack)" },
]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Framework :: FastAPI",
    "Topic :: Internet :: WWW/HTTP :: Session",
    "Topic :: Security :: Cryptography",
    "Typing :: Typed",
]
keywords = ["fastapi", "authentication", "oauth2", "jwt", "mfa", "rbac", "security"]

dependencies = [
    "fastapi>=0.110.0",
    "pydantic[email]>=2.0.0",
    "pydantic-settings>=2.0.0",
    "pwdlib[argon2,bcrypt]>=0.2.0",
    "pyjwt>=2.8.0",
    "itsdangerous>=2.1.0",
    "pyotp>=2.9.0",
    "authlib>=1.3.0",
    "httpx>=0.27.0",
    "cryptography>=42.0.0",
    "aiosmtplib>=3.0.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
sns = ["boto3>=1.34.0"]
redis = ["redis>=5.0.0"]
sqlalchemy = [
    "sqlalchemy[asyncio]>=2.0.30",
    "alembic>=1.13.1",
    "aiosqlite>=0.20.0",
]
postgres = [
    "sqlalchemy[asyncio]>=2.0.30",
    "alembic>=1.13.1",
    "asyncpg>=0.29.0",
]
all = [
    "boto3>=1.34.0",
    "redis>=5.0.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "alembic>=1.13.1",
    "aiosqlite>=0.20.0",
    "asyncpg>=0.29.0",
]

dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "respx>=0.21.0",
    "boto3>=1.34.0",
    "redis>=5.0.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "alembic>=1.13.1",
    "aiosqlite>=0.20.0",
    "asyncpg>=0.29.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "build>=1.2.1",
]

[project.scripts]
authkit = "authkit.cli:main"

[project.urls]
Homepage = "https://github.com/awun0105/AuthKit"
Repository = "https://github.com/awun0105/AuthKit"
Issues = "https://github.com/awun0105/AuthKit/issues"
Changelog = "https://github.com/awun0105/AuthKit/releases"

[tool.hatch.build.targets.wheel]
packages = ["authkit"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: integration tests using external or persistent resources",
    "postgres: tests that require a PostgreSQL server",
    "e2e: clean-consumer end-to-end tests",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.mypy]
python_version = "3.10"
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
exclude = ["authkit/adapters/sqlalchemy/migrations/"]

[[tool.mypy.overrides]]
module = ["authlib.*", "boto3", "boto3.*", "botocore.*"]
ignore_missing_imports = true
